services:
  thirdhand:
    build:
      context: .
      dockerfile: Dockerfile
    image: thirdhand:latest
    container_name: thirdhand
    user: "${THIRDHAND_UID:-1000}:${THIRDHAND_GID:-1000}"

    environment:
      TZ: "${TZ:-UTC}"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
    command: ["python", "main.py"]

    volumes:
      # Store config, sessions, and runtime state on the VPS.
      - ./volume:/app/volume

    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Root FS is read-only; only /tmp and /app/volume stay writable.
    read_only: true
    tmpfs:
      - /tmp:size=1g,noexec,nosuid

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
