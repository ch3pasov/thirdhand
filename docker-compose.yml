services:
  thirdhand:
    build:
      context: .
      dockerfile: Dockerfile
    image: thirdhand:latest
    container_name: thirdhand

    # Set THIRDHAND_DEBUG=1 in .env to enable verbose logs.
    environment:
      THIRDHAND_DEBUG: "${THIRDHAND_DEBUG:-0}"
      TZ: "${TZ:-UTC}"

    # Debug switch without editing compose:
    # THIRDHAND_DEBUG=1 docker compose up -d
    command:
      [
        "sh",
        "-c",
        "if [ \"$THIRDHAND_DEBUG\" = \"1\" ]; then exec python main.py --debug; else exec python main.py; fi",
      ]

    volumes:
      # Store config, session files, and runtime state on the VPS.
      - ./volume:/app/volume

    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Root FS is read-only; only /tmp and /app/volume stay writable.
    read_only: true
    tmpfs:
      - /tmp:size=1g,noexec,nosuid

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
